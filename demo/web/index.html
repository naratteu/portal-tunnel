<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal connector in a browser</title>
<style>
  :root { color-scheme: light dark; --ink:#1d1d1f; --bg:#faf9f7; --muted:#6b6b70; --line:#8883; --accent:#b4532a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e9e7e4; --bg:#15161a; --muted:#9a9aa0; --accent:#e0855a; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif}
  main{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
  h1{font-size:1.4rem;font-weight:660;letter-spacing:-.02em;margin:0 0 .4rem}
  .lede{color:var(--muted);margin:0 0 2rem;max-width:36rem}
  .card{background:color-mix(in srgb,var(--bg) 70%,#fff 30%);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
  @media (prefers-color-scheme: dark){ .card{background:#1e1f24} }
  .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #url{font-weight:650;color:var(--accent);word-break:break-all;font-size:1.05rem}
  #stage{font-weight:550}
  ul{list-style:none;margin:.6rem 0 0;padding:0;font:12.5px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);max-height:14rem;overflow-y:auto;border-left:2px solid var(--line);padding-left:.85rem}
</style>
</head>
<body>
<main>
  <h1>This tab is the origin</h1>
  <p class="lede">
    The portal connector, compiled to WebAssembly. No socket: the reverse session rides a
    WebSocket, tenant TLS terminates here, and the service it publishes is a handler in this
    page's runtime.
  </p>

  <div class="card">
    <div class="label">Status</div>
    <div id="stage">loading WebAssembly…</div>
  </div>

  <div class="card">
    <div class="label">Public URL</div>
    <div id="url">—</div>
  </div>

  <div class="card">
    <div class="label">Log</div>
    <ul id="log"></ul>
  </div>
</main>

<script src="relay.js"></script>
<script>
  // ?relay=https://... points the connector at any relay, so the same page can be
  // aimed at a public one.
  const override = new URLSearchParams(location.search).get('relay');
  if (override) { window.PORTAL_RELAY_URL = override; }
</script>
<script src="wasm_exec.js"></script>
<script>
const stageEl = document.getElementById('stage');
const urlEl = document.getElementById('url');
const logEl = document.getElementById('log');

window.portalRequests = 0;
window.portalPublicURL = null;

window.portalReport = (stage, detail) => {
  const line = document.createElement('li');
  line.textContent = `${new Date().toLocaleTimeString()}  ${stage}: ${detail}`;
  logEl.prepend(line);

  if (stage === 'ready') {
    window.portalPublicURL = detail;
    urlEl.textContent = detail;
    stageEl.textContent = 'serving';
  } else if (stage === 'request') {
    window.portalRequests++;
    stageEl.textContent = `serving — ${window.portalRequests} request(s) answered`;
  } else if (stage === 'error') {
    stageEl.textContent = 'failed';
  } else {
    stageEl.textContent = detail;
  }
};

const go = new Go();
WebAssembly.instantiateStreaming(fetch('connector.wasm'), go.importObject)
  .then(result => { stageEl.textContent = 'starting connector…'; go.run(result.instance); })
  .catch(err => { stageEl.textContent = 'wasm failed: ' + err; });
</script>
</body>
</html>
